name: Build from Source and Deploy to proxy-1

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: client_v2/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('client_v2/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Frontend & Backend
        run: |
          make deps
          CHANNEL=development make quick-build

      - name: Verify Binary
        run: |
          ls -lh AdGuardHome
          file AdGuardHome

      - name: Deploy to proxy-1 via OpenSSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          echo "Uploading AdGuardHome binary..."
          scp -P "$SSH_PORT" -i ~/.ssh/id_rsa AdGuardHome "$SSH_USER@$SSH_HOST:/tmp/AdGuardHome"

          echo "Installing and starting AdGuardHome service..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            sudo mkdir -p /opt/AdGuardHome
            if systemctl is-active --quiet AdGuardHome; then
              echo "Stopping existing AdGuardHome service..."
              sudo systemctl stop AdGuardHome
            fi
            sudo mv /tmp/AdGuardHome /opt/AdGuardHome/AdGuardHome
            sudo chmod +x /opt/AdGuardHome/AdGuardHome
            if [ ! -f /etc/systemd/system/AdGuardHome.service ]; then
              echo "Installing AdGuardHome service..."
              sudo /opt/AdGuardHome/AdGuardHome -s install
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable AdGuardHome
            sudo systemctl restart AdGuardHome
            echo "AdGuardHome service status:"
            systemctl status AdGuardHome --no-pager
          EOF
